name: WallpaperStudio

options:
  bundleIdPrefix: com.shuying
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  WallpaperStudio:
    type: application
    platform: iOS
    sources:
      - path: WallpaperStudio
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuying.wallpaperrs
        PRODUCT_NAME: WallpaperStudio
        INFOPLIST_FILE: WallpaperStudio/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.14.12"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

schemes:
  WallpaperStudio:
    build:
      targets:
        WallpaperStudio: all
    run:
      config: Debug
    archive:
      config: Release
