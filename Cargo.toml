[package]
name = "wallpaper-rs"
version = "0.9.1"
edition = "2021"
description = "Cross-platform desktop wallpaper app (Windows/macOS/Linux): fixed wallpaper or slideshow/rotation, built with Rust + egui."
license = "MIT"
readme = "README.md"
repository = "https://github.com/shuying-code/wallpaper-rs"
keywords = ["wallpaper", "desktop", "slideshow", "egui", "gui"]
categories = ["gui", "multimedia"]

[[bin]]
name = "wallpaper-rs"
path = "src/main.rs"

[lib]
name = "wallpaper_rs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
raw-window-handle = "0.6"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.14"
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(all(not(windows), not(target_os = "android")))'.dependencies]
global-hotkey = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.13"
log = "0.4"

[package.metadata.android]
package = "com.shuying.wallpaperrs"
apk_name = "wallpaper-rs"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "Wallpaper Studio"

[[package.metadata.android.uses_permission]]
name = "android.permission.SET_WALLPAPER"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[profile.release]
opt-level = 2
lto = false
