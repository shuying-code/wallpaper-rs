[package]
name = "wallpaper-rs"
version = "0.14.0"
edition = "2021"
description = "Cross-platform desktop wallpaper app (Windows/macOS/Linux): fixed wallpaper or slideshow/rotation, built with Rust + egui."
license = "MIT"
readme = "README.md"
repository = "https://github.com/shuying-code/wallpaper-rs"
keywords = ["wallpaper", "desktop", "slideshow", "egui", "gui"]
categories = ["gui", "multimedia"]

[[bin]]
name = "wallpaper-rs"
path = "src/main.rs"

[lib]
name = "wallpaper_rs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }
# `cookies`：在同一个 agent 内持久化站点下发的 Cookie。彼岸图网（pic.netbian.com）
# 位于百度 WAF 之后，会下发 abymg_id 等令牌；缺少 Cookie 时后续请求会被拦截，
# 表现为「接口访问不通」。共享带 Cookie 罐的 agent 后可稳定长期浏览。
# `native-certs`：rustls 改用「系统证书存储」而非仅内置根证书。部分环境（如经过
# 企业/运营商 TLS 中间代理时）GitHub 等站点的证书链不在内置根列表里，用系统存储
# 才能正常校验（否则 mpv 按需下载会报 UnknownIssuer）。
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "json", "cookies"] }
raw-window-handle = "0.6"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.14"
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 动态壁纸宿主用 Cocoa 建桌面层无边框窗口（objc 提供 msg_send! 宏）。
objc = "0.2"

[target.'cfg(all(not(windows), not(target_os = "android")))'.dependencies]
global-hotkey = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.13"
log = "0.4"

[package.metadata.android]
package = "com.shuying.wallpaperrs"
apk_name = "wallpaper-rs"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "Wallpaper Studio"

[[package.metadata.android.uses_permission]]
name = "android.permission.SET_WALLPAPER"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[profile.release]
# 尽量减小发行体积（对所有平台生效）。opt-level="z" 面向体积；fat LTO +
# codegen-units=1 去重并内联；panic=abort 去掉 unwind 表；strip 去掉符号表。
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
