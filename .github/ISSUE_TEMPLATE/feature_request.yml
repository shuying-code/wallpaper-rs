name: 💡 功能建议 / Feature request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出功能建议。请描述清楚**使用场景**与**期望效果**，便于评估。
        > 维护者通常**每周集中评估一次**新建议。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / 要解决的问题
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 参考

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索现有 issue，未发现相同建议
          required: true
