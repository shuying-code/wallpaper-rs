name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (e.g. v0.9.1)"
        required: true
        default: "v0.9.1"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- Windows --
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release
      - name: Package (portable zip)
        shell: pwsh
        run: |
          $pkg = "dist/wallpaper-rs-windows-x64"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item target/release/wallpaper-rs.exe "$pkg/wallpaper-rs.exe"
          Copy-Item README.md "$pkg/README.md"
          Copy-Item packaging/windows/THIRD-PARTY-NOTICES.md "$pkg/"
          Compress-Archive -Path "$pkg/*" -DestinationPath dist/wallpaper-rs-windows-x64.zip -Force
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          Write-Host "Using $iscc for v$ver"
          & $iscc "/DMyAppVersion=$ver" packaging\windows\wallpaper-rs.iss
      - name: Single-file exe (轻量：运行时按需下载 mpv)
        shell: pwsh
        run: |
          # 单文件发行版不再内嵌 mpv（体积从 ~52 MB 降到 ~5 MB）：
          # 首次使用动态壁纸 / 锁屏时按需把 mpv 下载到用户缓存目录。
          Copy-Item target/release/wallpaper-rs.exe dist/wallpaper-rs-windows-x64.exe -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/wallpaper-rs-windows-x64.zip
            dist/wallpaper-rs-windows-x64-setup.exe
            dist/wallpaper-rs-windows-x64.exe

  # ------------------------------------------------------------------ macOS --
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build universal (arm64 + x86_64)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/wallpaper-rs-macos-universal \
            target/aarch64-apple-darwin/release/wallpaper-rs \
            target/x86_64-apple-darwin/release/wallpaper-rs
          chmod +x dist/wallpaper-rs-macos-universal
          codesign --force --sign - dist/wallpaper-rs-macos-universal || true
          lipo -info dist/wallpaper-rs-macos-universal
      - name: Package (tar.gz)
        run: |
          cd dist
          tar -czf wallpaper-rs-macos-universal.tar.gz wallpaper-rs-macos-universal
      - name: Build .app bundle + .dmg
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          APP="dist/Wallpaper Studio.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          cp dist/wallpaper-rs-macos-universal "$APP/Contents/MacOS/wallpaper-rs"
          chmod +x "$APP/Contents/MacOS/wallpaper-rs"
          codesign --force --deep --sign - "$APP" || true
          rm -rf dmgroot && mkdir -p dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Wallpaper Studio" -srcfolder dmgroot -ov -format UDZO dist/wallpaper-rs-macos-universal.dmg
          rm -rf dmgroot
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/wallpaper-rs-macos-universal.tar.gz
            dist/wallpaper-rs-macos-universal.dmg

  # ------------------------------------------------------------------ Linux --
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libgtk-3-dev libgl1-mesa-dev \
            libayatana-appindicator3-dev \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package (tar.gz + .deb)
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          mkdir -p dist
          cp target/release/wallpaper-rs dist/wallpaper-rs-linux-x64
          chmod +x dist/wallpaper-rs-linux-x64
          tar -czf dist/wallpaper-rs-linux-x64.tar.gz -C dist wallpaper-rs-linux-x64
          # .deb
          mkdir -p deb/DEBIAN deb/usr/bin deb/usr/share/applications deb/usr/share/icons/hicolor/256x256/apps
          sed "s/__VERSION__/$VERSION/g" packaging/linux/control > deb/DEBIAN/control
          cp target/release/wallpaper-rs deb/usr/bin/wallpaper-rs
          cp packaging/linux/wallpaper-rs.desktop deb/usr/share/applications/
          cp packaging/linux/wallpaper-rs.png deb/usr/share/icons/hicolor/256x256/apps/
          dpkg-deb --build --root-owner-group deb dist/wallpaper-rs-linux-x64.deb
      - name: Build AppImage
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/wallpaper-rs AppDir/usr/bin/wallpaper-rs
          cp packaging/linux/wallpaper-rs.desktop AppDir/wallpaper-rs.desktop
          cp packaging/linux/wallpaper-rs.desktop AppDir/usr/share/applications/
          cp packaging/linux/wallpaper-rs.png AppDir/wallpaper-rs.png
          cp packaging/linux/wallpaper-rs.png AppDir/usr/share/icons/hicolor/256x256/apps/wallpaper-rs.png
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/wallpaper-rs" "$@"
          EOF
          chmod +x AppDir/AppRun
          wget -q -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/wallpaper-rs-linux-x64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/wallpaper-rs-linux-x64.tar.gz
            dist/wallpaper-rs-linux-x64.deb
            dist/wallpaper-rs-linux-x64.AppImage

  # ---------------------------------------------------------------- Android --
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK / NDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          echo "Using $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$SDK/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0
      - name: Build APK (release, signed with generated keystore)
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore release.jks -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Wallpaper Studio, OU=App, O=shuying-code, L=City, S=State, C=CN"
          export CARGO_APK_RELEASE_KEYSTORE="$PWD/release.jks"
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android
          export CARGO_APK_RELEASE_KEYSTORE_KEY_PASSWORD=android
          cargo apk build --release --lib
          mkdir -p dist
          cp target/release/apk/wallpaper-rs.apk dist/wallpaper-rs-android-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/wallpaper-rs-android-universal.apk

  # ---------------------------------------------------------------- Release --
  release:
    needs: [ windows, macos, linux, android ]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: List assets
        run: ls -laR assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: assets/*
          fail_on_unmatched_files: false
