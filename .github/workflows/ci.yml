name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libgtk-3-dev libgl1-mesa-dev \
            libayatana-appindicator3-dev \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Smoke test
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./target/release/wallpaper-rs.exe --selftest
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            ./target/release/wallpaper-rs --selftest
          else
            ./target/release/wallpaper-rs --selftest
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-rs-${{ matrix.os }}
          path: |
            target/release/wallpaper-rs
            target/release/wallpaper-rs.exe
          if-no-files-found: ignore
